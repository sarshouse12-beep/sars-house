const chat = { open: false, busy: false, sid: '', msgs: [] };
try { chat.sid = localStorage.getItem('sh_chat_sid') || ''; const m = JSON.parse(localStorage.getItem('sh_chat_msgs') || '[]'); chat.msgs = Array.isArray(m) ? m.filter(x => x && (x.role === 'user' || x.role === 'assistant') && typeof x.content === 'string') : []; } catch (e) {}
function saveChat() { try { localStorage.setItem('sh_chat_sid', chat.sid); localStorage.setItem('sh_chat_msgs', JSON.stringify(chat.msgs.filter(m => !m.err).slice(-20))); } catch (e) {} }
const chatOn = () => !!sb && !!(state.chatCfg && state.chatCfg.enabled);
const chatChips = () => {

};
function chatGreeting() {

  const t = (LANG === 'en' ? (c.welcome_en || c.welcome) : c.welcome) || DEFAULT_CHAT.welcome;

function chatBubble(m) {

  return `<div class="flex ${u ? 'justify-end' : 'justify-start'}"><div class="max-w-[85%] px-3 py-2 rounded-2xl whitespace-pre-line break-words ${u ? 'bg-brand text-white rounded-br-sm' : 'bg-white border border-gray-200 text-gray-800 rounded-bl-sm'}">${esc(m.content)}</div></div>`;
}
function renderChatMsgs() {

  box.innerHTML = chatBubble({ role: 'assistant', content: chatGreeting() }) + chat.msgs.map(chatBubble).join('') +
    (chat.busy ? '<div class="flex justify-start"><div class="px-3 py-2 rounded-2xl bg-white border border-gray-200 text-gray-400"><i class="fa-solid fa-ellipsis fa-fade"></i></div></div>' : '');
  box.scrollTop = box.scrollHeight;
  $('#chatChips').innerHTML = chat.msgs.length ? '' : chatChips().map((c, i) => `<button type="button" data-action="chatChip" data-i="${i}" class="whitespace-nowrap text-xs border border-gold text-brand rounded-full px-3 py-1 hover:bg-amber-50">${i === 3 ? '<i class="fa-brands fa-whatsapp text-green-600"></i> ' : ''}${esc(c)}</button>`).join('');
}
function renderChat() {
  const fab = $('#chatFab'), panel = $('#chatPanel'); if (!fab || !panel) return;
  const on = chatOn();
  fab.classList.toggle('flex', on && !chat.open); fab.classList.toggle('hidden', !(on && !chat.open));
  panel.classList.toggle('flex', on && chat.open); panel.classList.toggle('hidden', !(on && chat.open));
  const wa = $('#chatWa'); if (wa) wa.href = 'https://wa.me/' + digits(state.design.whatsapp);
  const cc = state.chatCfg || {}, pick = k => ((LANG === 'en' && cc[k + '_en']) ? cc[k + '_en'] : cc[k]);
  const ic = $('#chatIcon'); if (ic) ic.className = 'fa-solid ' + (/^fa-[a-z0-9-]+$/.test(cc.icon || '') ? cc.icon : 'fa-headset');
  const nm = $('#chatName'); if (nm) nm.textContent = pick('name') || '';
  const sb2 = $('#chatSub'); if (sb2) sb2.textContent = pick('subtitle') || '';
  const nt = $('#chatNote'); if (nt) { nt.textContent = pick('note') || ''; nt.classList.toggle('hidden', !nt.textContent); }
  if (on && chat.open) renderChatMsgs();
  const tz = $('#chatTeaser'); if (tz) {
    const tx = teaserText(), show = on && !chat.open && teaserReady && !teaserShut && cc.teaser_on !== false && !!tx;
    tz.classList.toggle('hidden', !show); $('#chatTeaserTx').textContent = tx;
    if (show && !teaserTimer) teaserTimer = setTimeout(closeTeaser, 9000);

let teaserReady = false, teaserShut = false, teaserTimer = 0;
try { teaserShut = sessionStorage.getItem('sh_teaser_shut') === '1'; } catch (e) {}
setTimeout(() => { teaserReady = true; try { renderChat(); } catch (e) {} }, 5000);
function teaserText() { const c = state.chatCfg || {}; return String((LANG === 'en' ? (c.teaser_en || c.teaser) : c.teaser) || '').trim(); }
function closeTeaser() { teaserShut = true; try { sessionStorage.setItem('sh_teaser_shut', '1'); } catch (e) {} renderChat(); }
function toggleChat() { chat.open = !chat.open; if (chat.open) teaserShut = true; renderChat(); if (chat.open) setTimeout(() => { const i = $('#chatInput'); if (i && window.innerWidth > 640) i.focus(); }, 50); }
async function sendChat(text) {
  text = String(text || '').trim().slice(0, 500);
  if (!text || chat.busy || !sb) return;
  chat.msgs.push({ role: 'user', content: text }); chat.busy = true; renderChatMsgs();
  try {
    const { data, error } = await sb.functions.invoke('chat', { body: { session_id: chat.sid, message: text, lang: LANG } });
    if (data && data.session_id) chat.sid = data.session_id;
    if (error || !data || !data.reply) throw error || new Error('no reply');
    chat.msgs.push({ role: 'assistant', content: data.reply });
  } catch (e) {
    console.warn(e);
    chat.msgs.push({ role: 'assistant', err: true, content: LANG === 'en' ? 'Sorry, I could not answer right now. Please message us on WhatsApp.' : 'দুঃখিত, এখন উত্তর দিতে পারছি না। অনুগ্রহ করে WhatsApp-এ মেসেজ করুন।' });
  }
  chat.busy = false; saveChat(); renderChatMsgs();
}

  if (c) c.qty += 1; else state.cart.push({ id, qty: 1, v: v || '' });

}

async function handleSignup(f) {
  const fd = new FormData(f), phone = normPhone(fd.get('phone')), name = fd.get('name').trim();

  const btn = $('button[type=submit]', f); btn.disabled = true;
  const { data, error } = await sb.auth.signUp({ email: fd.get('email').trim(), password: fd.get('password'), options: { data: { full_name: name, phone } } });

async function prepareImage(file, maxW) {
  const okTypes = ['image/jpeg', 'image/png', 'image/webp'];
  if (file.type === 'image/gif') { if (file.size > 5 * 1048576) throw new Error('ছবি ৫MB-এর কম হতে হবে'); return { blob: file, ext: 'gif', type: 'image/gif' }; }
  if (!okTypes.includes(file.type)) throw new Error('শুধু JPG, PNG, WEBP বা GIF ছবি দিন');
  const img = await new Promise((res, rej) => {
    const i = new Image(), u = URL.createObjectURL(file);
    i.onload = () => { URL.revokeObjectURL(u); res(i); };
    i.onerror = () => { URL.revokeObjectURL(u); rej(new Error('ছবি পড়া যায়নি')); };
    i.src = u;
  });
  const sc = Math.min(1, maxW / Math.max(img.width, img.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r => cv.toBlob(r, file.type, 0.86));
  if (!blob) throw new Error('ছবি প্রসেস করা যায়নি');
  if (blob.size > 5 * 1048576) throw new Error('ছবি ৫MB-এর কম হতে হবে');
  return { blob, ext: file.type === 'image/png' ? 'png' : file.type === 'image/webp' ? 'webp' : 'jpg', type: file.type };
}
async function uploadImage(file, folder, maxW) {
  if (!sb) throw new Error('Supabase সংযোগ করা নেই');
  const { blob, ext, type } = await prepareImage(file, maxW || 1200);
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: type, cacheControl: '31536000' });
  if (error) throw error;
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}
async function deleteImage(url) {
  try {
    const part = String(url || '').split('/object/public/' + BUCKET + '/')[1];
    if (part && sb) await sb.storage.from(BUCKET).remove([decodeURIComponent(part.split('?')[0])]);

}

const siteUrl = () => location.origin + location.pathname;

function qrPng(url, label, sub) {
  if (typeof qrcode === 'undefined') return '';
  const q = qrcode(0, 'M'); q.addData(url); q.make();
  const n = q.getModuleCount(), cell = Math.max(4, Math.floor(420 / n)), qs = cell * n, pad = 30, W = qs + pad * 2, H = W + 70;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, W, H); c.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) c.fillRect(pad + k * cell, pad + r * cell, cell, cell);
  c.textAlign = 'center'; c.fillStyle = '#0b2e2a';
  c.font = 'bold 22px "Hind Siliguri", sans-serif'; c.fillText(String(label || '').slice(0, 34), W / 2, qs + pad + 38, W - 20);
  c.font = '15px "Hind Siliguri", sans-serif'; c.fillStyle = '#555'; c.fillText(String(sub || '').slice(0, 44), W / 2, qs + pad + 62, W - 20);

}

async function saveProduct(f) {
  const fd = new FormData(f), name = fd.get('name').trim(), price = Number(fd.get('price'));
  if (!name || !(price >= 0)) return toast('নাম ও সঠিক মূল্য দিন', 'err');
  const old = fd.get('old_price') === '' ? null : Number(fd.get('old_price'));
  const row = {
    name, category: fd.get('category'), weight: fd.get('weight').trim(), price, old_price: old, tag: fd.get('tag').trim(),
    sort_order: parseInt(fd.get('sort_order'), 10) || 0, description: fd.get('description').trim(),
    in_stock: fd.get('in_stock') === 'on', image_url: state.pfImage || null,
    name_en: (fd.get('name_en') || '').trim(), description_en: (fd.get('description_en') || '').trim()
  };
  if (state.feat) {
    const vr = parseVariants(fd.get('variants')); if (vr.error) return toast(vr.error, 'err');
    row.variants = vr.list; row.images = state.pfImages.slice(0, 4); row.is_combo = fd.get('is_combo') === 'on';
    if (state.featBest) row.is_best = fd.get('is_best') === 'on';
    const sq = String(fd.get('stock_qty') ?? '').trim(); row.stock_qty = sq === '' ? null : Math.max(0, parseInt(enNum(sq), 10) || 0);
    if (row.stock_qty !== null) row.in_stock = row.stock_qty > 0;
    if (vr.list.length) { row.price = Math.min(...vr.list.map(v => v.price)); row.old_price = null; row.weight = ''; }
  }
  const btn = $('button[type=submit]', f); btn.disabled = true;
  const q = state.pfId ? sb.from('products').update(row).eq('id', state.pfId) : sb.from('products').insert(row);
  const { error } = await q; btn.disabled = false;
  if (error) { console.warn(error); return toast('সংরক্ষণ ব্যর্থ: ' + error.message, 'err'); }
  toast('✅ পণ্য সংরক্ষিত হয়েছে'); closeModal();
  await loadProducts(); renderProducts(); updateBadges(); renderAdminTab();
}

async function saveCoupon(f) {
  const fd = new FormData(f), code = String(fd.get('code') || '').trim().toUpperCase(), kind = fd.get('kind'), value = Number(enNum(fd.get('value')) || 0);
  if (!/^[A-Z0-9_-]{2,30}$/.test(code)) return toast('কোডে শুধু ইংরেজি অক্ষর, সংখ্যা, - বা _ ব্যবহার করুন', 'err');
  if (kind === 'percent' && !(value > 0 && value <= 100)) return toast('শতাংশ ১ থেকে ১০০ এর মধ্যে দিন', 'err');
  if (kind === 'fixed' && !(value > 0)) return toast('ছাড়ের টাকার পরিমাণ দিন', 'err');
  const num = k => { const v = String(fd.get(k) || '').trim(); return v === '' ? null : Number(enNum(v)); };
  const ex = String(fd.get('expires') || '');
  const row = { code, kind, value: kind === 'free_delivery' ? 0 : value, max_discount: kind === 'percent' ? num('max_discount') : null, min_order: num('min_order') || 0, max_uses: num('max_uses'),
    expires_at: ex ? new Date(ex + 'T23:59:59+06:00').toISOString() : null, active: fd.get('active') === 'on', note: String(fd.get('note') || '').trim() };
  const btn = $('button[type=submit]', f); btn.disabled = true;
  const { error } = state.cfId ? await sb.from('coupons').update(row).eq('id', state.cfId) : await sb.from('coupons').insert(row);
  btn.disabled = false;
  if (error) return toast(error.code === '23505' ? 'এই কোড আগেই আছে' : 'সংরক্ষণ ব্যর্থ: ' + error.message, 'err');
  toast('✅ কুপন সংরক্ষিত হয়েছে'); closeModal(); await loadCoupons(); renderAdminTab();
}

async function saveBulk(f) {
  const fd = new FormData(f), jobs = [];
  prodAll().forEach(p => {
    const n = p.id, row = {};
    if (!hasVariants(p)) {
      const w = String(fd.get('w_' + n) ?? '').trim(), pr = Number(enNum(fd.get('p_' + n)) || 0), od = String(fd.get('o_' + n) ?? '').trim();
      if (w !== (p.weight || '')) row.weight = w;
      if (pr !== Number(p.price)) row.price = pr;
      const o2 = od === '' ? null : Number(enNum(od)); if (o2 !== (p.old_price === null || p.old_price === undefined ? null : Number(p.old_price))) row.old_price = o2;
    }
    if (state.feat) {
      const sv = String(fd.get('s_' + n) ?? '').trim(), s2 = sv === '' ? null : Math.max(0, parseInt(enNum(sv), 10) || 0);
      if (s2 !== (p.stock_qty === undefined ? null : p.stock_qty)) { row.stock_qty = s2; if (s2 !== null) row.in_stock = s2 > 0; }
    }
    if (Object.keys(row).length) jobs.push(sb.from('products').update(row).eq('id', n));
  });
  if (!jobs.length) return toast('কোনো পরিবর্তন নেই');
  const btn = $('button[type=submit]', f); btn.disabled = true;
  const res = await Promise.all(jobs); btn.disabled = false;
  const bad = res.find(r => r.error); if (bad) { console.warn(bad.error); return toast('কিছু পণ্য সংরক্ষণ হয়নি: ' + bad.error.message, 'err'); }
  toast(`✅ ${bn(jobs.length)}টি পণ্য আপডেট হয়েছে`); closeModal(); await loadProducts(); renderProducts(); updateBadges(); renderAdminTab();
}

/* ---- save feedback: buttons stay dim until there is something to save ---- */
let saving = false;
const DIRTY_KEYS = { design: 'design', shop: 'design', ads: 'ads', chats: 'chat' };
function isDirty() {
  const k = DIRTY_KEYS[state.adminTab]; if (!k || !adminDraft) return false;
  return JSON.stringify(adminDraft[k]) !== JSON.stringify(k === 'chat' ? state.chatCfg : state[k]);
}
function updateDirty() {
  if (!DIRTY_KEYS[state.adminTab]) return;
  const dirty = isDirty();
  $$('[data-save-ui]').forEach(b => { b.disabled = saving || !dirty; });
  const st = $('#saveState');
  if (st) st.innerHTML = saving ? '<span class="text-gray-600"><i class="fa-solid fa-spinner fa-spin"></i> সংরক্ষণ হচ্ছে...</span>'
    : dirty ? '<span class="text-amber-600"><i class="fa-solid fa-circle text-[8px] align-middle"></i> অসংরক্ষিত পরিবর্তন আছে</span>'
            : '<span class="text-green-600"><i class="fa-solid fa-circle-check"></i> সব সংরক্ষিত</span>';
}
function setSaving(on) {
  saving = on;
  const b = $('#saveBtn');
  if (b) b.innerHTML = on ? '<i class="fa-solid fa-spinner fa-spin"></i> <span>সংরক্ষণ হচ্ছে...</span>' : '<i class="fa-solid fa-floppy-disk"></i> <span>সংরক্ষণ করুন</span>';
  updateDirty();
}
const saveBtns = act => `<span id="saveState" class="mr-auto text-xs sm:text-sm font-semibold"></span>
      <button data-save-ui data-action="a-discard" class="btn btn-ghost">বাতিল করুন</button>
      <button data-save-ui id="saveBtn" data-action="${act}" class="btn btn-cta px-8"><i class="fa-solid fa-floppy-disk"></i> <span>সংরক্ষণ করুন</span></button>`;
const saveBar = act => `<div class="fixed bottom-14 md:bottom-0 inset-x-0 bg-white border-t p-3 z-30"><div class="max-w-6xl mx-auto flex gap-2 items-center justify-end">${saveBtns(act)}</div></div>`;

async function applyCategoryChanges() {
  if (!can('products')) return true;
  const d = adminDraft.design;
  const cs = (d.categories || []).map(c => ({ ...c, name: String(c.name || '').trim(), name_en: String(c.name_en || '').trim() }));
  if (!cs.length) { toast('কমপক্ষে একটি ক্যাটেগরি রাখতে হবে', 'err'); return false; }
  if (cs.some(c => !c.name)) { toast('ক্যাটেগরির নাম খালি রাখা যাবে না', 'err'); return false; }
  if (new Set(cs.map(c => c.name)).size !== cs.length) { toast('দুটি ক্যাটেগরির নাম একই হতে পারবে না', 'err'); return false; }
  const old = state.design.categories || [], renames = [];
  cs.forEach(c => { const o = old.find(x => x.id === c.id); if (o && o.name !== c.name) renames.push({ from: o.name, to: c.name, id: c.id }); });
  const map = {}; renames.forEach(r => { map[r.from] = r.to; });
  const names = new Set(cs.map(c => c.name)), orphans = {};
  prodAll().forEach(p => { const nc = map[p.category] || p.category; if (!names.has(nc)) orphans[nc] = (orphans[nc] || 0) + 1; });
  const orphanCount = Object.values(orphans).reduce((a, b) => a + b, 0), target = cs[0].name;
  if (orphanCount && !confirm(LANG === 'en' ? `${orphanCount} product(s) belong to a removed category. They will be moved to "${target}". Continue?` : `মুছে ফেলা ক্যাটেগরির ${bn(orphanCount)}টি পণ্য আছে। সেগুলো "${target}" ক্যাটেগরিতে সরানো হবে। ঠিক আছে?`)) return false;
  const move = async (from, to) => { const { error } = await sb.from('products').update({ category: to }).eq('category', from); if (error) { console.warn(error); toast('ক্যাটেগরি বদলাতে ব্যর্থ: ' + error.message, 'err'); return false; } return true; };
  const two = renames.length > 1;
  for (const r of renames) if (!await move(r.from, two ? '__tmp__' + r.id : r.to)) return false;
  if (two) for (const r of renames) if (!await move('__tmp__' + r.id, r.to)) return false;
  for (const name of Object.keys(orphans)) if (!await move(name, target)) return false;
  d.categories = cs;
  if (map[state.cat]) state.cat = map[state.cat]; else if (state.cat !== 'all' && !names.has(state.cat)) state.cat = 'all';
  if (renames.length || orphanCount) await loadProducts();
  return true;
}
async function saveSettings(key) {
  if (!sb) return toast('ডেমো মোড: Supabase সংযোগ করুন', 'err');
  if (saving) return;
  setSaving(true);
  try {
    if (key === 'design' && !await applyCategoryChanges()) return;
    const val = clone(adminDraft[key]);
    const { error } = await sb.from('store_settings').upsert({ key, value: val, updated_at: new Date().toISOString() });
    if (error) { console.warn(error); return toast('সংরক্ষণ ব্যর্থ: ' + error.message, 'err'); }
    state[key] = clone(val); applyTheme(); renderStore();
    toast('✅ সংরক্ষিত হয়েছে — দোকানে আপডেট দেখা যাবে');
  } finally { setSaving(false); }
}

async function loadChatSessions() {
  if (!sb) return;
  const { data: ses, error } = await sb.from('chat_sessions').select('*').order('last_at', { ascending: false }).limit(100);
  if (error) { console.warn(error); toast('চ্যাট লোড করা যায়নি', 'err'); return; }
  const ids = (ses || []).map(x => x.id);
  let msgs = [];
  if (ids.length) {
    const r = await sb.from('chat_messages').select('id,session_id,role,content,created_at').in('session_id', ids).order('id', { ascending: true }).limit(2000);
    msgs = r.data || [];
  }
  const by = {}; msgs.forEach(m => { (by[m.session_id] = by[m.session_id] || []).push(m); });
  state.chatSessions = (ses || []).map(x => ({ ...x, msgs: by[x.id] || [] })).filter(x => x.msgs.length);
}

    case 'a-couponToggle': { const c = state.adminCoupons.find(x => x.id === id); if (!c) break; const { error } = await sb.from('coupons').update({ active: !c.active }).eq('id', id); if (error) return toast('আপডেট ব্যর্থ', 'err'); c.active = !c.active; renderAdminTab(); break; }
    case 'a-delCoupon': { if (!confirm('এই কুপনটি মুছে ফেলবেন?')) break; const { error } = await sb.from('coupons').delete().eq('id', id); if (error) return toast('মুছতে ব্যর্থ', 'err'); await loadCoupons(); renderAdminTab(); break; }
    case 'a-revToggle': { const r = state.adminReviews.find(x => x.id === id); if (!r) break; const { error } = await sb.from('reviews').update({ approved: !r.approved }).eq('id', id); if (error) return toast('আপডেট ব্যর্থ', 'err'); r.approved = !r.approved; await loadReviews(); renderProducts(); renderAdminTab(); break; }
    case 'a-revDel': { if (!confirm('এই রিভিউটি মুছে ফেলবেন?')) break; const { error } = await sb.from('reviews').delete().eq('id', id); if (error) return toast('মুছতে ব্যর্থ', 'err'); state.adminReviews = state.adminReviews.filter(x => x.id !== id); await loadReviews(); renderProducts(); renderAdminTab(); break; }
    case 'a-reqClear': { const { error } = await sb.from('stock_requests').delete().eq('product_id', id); if (error) return toast('মুছতে ব্যর্থ', 'err'); state.adminRequests = state.adminRequests.filter(x => x.product_id !== id); renderAdminTab(); break; }
    case 'a-editProduct': openProductForm(id); break;
    case 'a-pfRemoveImg': state.pfImage = ''; $('#pf_prev').innerHTML = prevImg(''); break;
    case 'a-stock': {
      const p = prodAll().find(x => x.id === id); if (!p) break;
      el.disabled = true;
      const { error } = await sb.from('products').update({ in_stock: !p.in_stock }).eq('id', id);
      if (error) { el.disabled = false; return toast('আপডেট ব্যর্থ', 'err'); }
      p.in_stock = !p.in_stock; renderAdminTab(); renderProducts(); updateBadges();
      toast(p.in_stock ? '✅ পণ্য স্টকে আছে হিসেবে চিহ্নিত হয়েছে' : '✅ পণ্য স্টক শেষ হিসেবে চিহ্নিত হয়েছে'); break;
    }
    case 'a-hide': {
      const p = prodAll().find(x => x.id === id); if (!p) break;
      const hide = !p.is_hidden;
      const { error } = await sb.from('products').update({ is_hidden: hide }).eq('id', id);
      if (error) { console.warn(error); return toast('হয়নি। supabase-hide-products.sql চালানো হয়েছে কি?', 'err'); }
      if (hide) { state.cart = state.cart.filter(c => c.id !== id); saveCart(); }
      await loadProducts(); renderProducts(); renderCats(); updateBadges(); renderAdminTab(); toast(hide ? 'পণ্যটি দোকান থেকে লুকানো হয়েছে' : '✅ দোকানে ফিরে এসেছে'); break;
    }
    case 'a-delProduct': {
      const p = prodAll().find(x => x.id === id); if (!p || !confirm(LANG === 'en' ? `Delete "${p.name}"?` : `"${p.name}" মুছে ফেলবেন?`)) break;
      const { error } = await sb.from('products').delete().eq('id', id);
      if (error) return toast('মুছতে ব্যর্থ', 'err');
      if (p.image_url) deleteImage(p.image_url);
      (Array.isArray(p.images) ? p.images : []).forEach(u => deleteImage(u));
      state.cart = state.cart.filter(c => c.id !== id); saveCart();
      await loadProducts(); renderProducts(); updateBadges(); renderAdminTab(); toast('পণ্য মুছে ফেলা হয়েছে'); break;
    }
    case 'a-orderFilter': { state.orderFilter = el.dataset.f; renderAdminTab(); const l = $('#orderList'); if (l) l.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
    case 'a-reloadOrders': await loadAdminOrders(); renderAdminTab(); break;
    case 'a-delOrder': {
      if (!confirm(tr('এই অর্ডারটি স্থায়ীভাবে মুছে ফেলবেন?'))) break;
      const { error } = await sb.from('orders').delete().eq('id', id);
      if (error) return toast('মুছতে ব্যর্থ', 'err');
      state.adminOrders = state.adminOrders.filter(o => o.id !== id); renderAdminTab(); toast('অর্ডার মুছে ফেলা হয়েছে'); break;
    }
    case 'a-mfaStart': mfaStart(); break;
    case 'a-mfaOff': mfaOff(); break;
    case 'a-fpOn': fpOn(); break;
    case 'a-fpOff': fpOff(); break;
    case 'a-lockOff': lockOff(); break;
    case 'a-fpTry': fpUnlock(); break;
    case 'lk': lockPress(el.dataset.k); break;
    case 'lkpad': lockPad = true; renderLockScreen(); break;
    case 'a-restore': restoreProduct(id); break;
    case 'a-reloadUsers': await loadAdminUsers(); renderAdminTab(); break;
    case 'a-rmimg': setPath(adminDraft, el.dataset.path, ''); renderAdminTab(); break;
    case 'a-resetColors': adminDraft.design.colors = { ...DEFAULT_COLORS }; applyTheme(adminDraft.design.colors); renderAdminTab(); break;
    case 'a-discard': applyTheme(); adminDraft = { design: clone(state.design), ads: clone(state.ads), chat: clone(state.chatCfg) }; renderAdminTab(); toast('পরিবর্তন বাতিল করা হয়েছে'); break;
    case 'a-saveDesign': saveSettings('design'); break;
    case 'a-saveAds': saveSettings('ads'); break;
    case 'a-saveChat': saveChatCfg(); break;
    case 'a-catAdd': { const cs = adminDraft.design.categories; if (cs.length >= 12) { toast('সর্বোচ্চ ১২টি ক্যাটেগরি রাখা যাবে', 'err'); break; } cs.push({ id: 'c' + Date.now().toString(36), name: 'নতুন ক্যাটেগরি', name_en: 'New Category', icon: 'fa-tag', image: '' }); renderAdminTab(); break; }
    case 'a-catDel': { const cs = adminDraft.design.categories; if (cs.length <= 1) { toast('কমপক্ষে একটি ক্যাটেগরি রাখতে হবে', 'err'); break; } cs.splice(Number(el.dataset.i), 1); renderAdminTab(); break; }
    case 'a-catUp': case 'a-catDown': { const cs = adminDraft.design.categories, i = Number(el.dataset.i), j = a === 'a-catUp' ? i - 1 : i + 1; if (j < 0 || j >= cs.length) break; [cs[i], cs[j]] = [cs[j], cs[i]]; renderAdminTab(); break; }
    case 'a-qrDl': qrDownload(id); break;
    case 'a-qrCopy': copyText(id === 'site' ? siteUrl() : productUrl(id)); break;
    case 'a-qrPrint': qrPrintAll(); break;
    case 'copyPLink': copyText(productUrl(id)); break;
    case 'a-reloadChats': await loadChatSessions(); renderAdminTab(); break;
    case 'a-chatOpen': state.chatOpenId = state.chatOpenId === id ? null : id; renderAdminTab(); break;
    case 'a-delChat': {
      if (!confirm(tr('এই চ্যাটটি স্থায়ীভাবে মুছে ফেলবেন?'))) break;
      const { error } = await sb.from('chat_sessions').delete().eq('id', id);
      if (error) return toast('মুছতে ব্যর্থ', 'err');
      state.chatSessions = state.chatSessions.filter(c => c.id !== id); state.chatOpenId = null; renderAdminTab(); toast('চ্যাট মুছে ফেলা হয়েছে'); break;
    }
  }
});

document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  switch (f.dataset.form) {
    case 'checkout': placeOrder(); break;
    case 'coupon': applyCoupon($('#c_coupon').value); break;
    case 'review': handleReview(f); break;
    case 'coupon-admin': saveCoupon(f); break;
    case 'bulk': saveBulk(f); break;
    case 'notify': handleNotify(f); break;
    case 'chat': { const i = $('#chatInput'); const v = i.value; i.value = ''; sendChat(v); break; }
    case 'signin': handleSignin(f); break;
    case 'mfa-verify': handleMfaVerify(f); break;
    case 'lock-set': handleLockSet(f); break;
    case 'mfa-enroll': handleMfaEnroll(f); break;
    case 'signup': handleSignup(f); break;
    case 'profile': handleProfile(f); break;
    case 'product': saveProduct(f); break;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.classList.contains('search-inp')) return setSearch(t.value, t);
  if (t.dataset && t.dataset.prodq !== undefined) { state.pq = t.value; const l = $('#prodList'); if (l) l.innerHTML = prodRows(); return; }
  if (t.dataset && t.dataset.setq !== undefined) {
    const q = t.value.trim().toLowerCase(); let any = false;
    $$('#setHub [data-kw]').forEach(b => { const ok = !q || b.dataset.kw.includes(q); b.classList.toggle('hidden', !ok); if (ok) any = true; });
    $$('#setHub [data-g]').forEach(g => g.classList.toggle('hidden', !$$('[data-kw]', g).some(b => !b.classList.contains('hidden'))));
    const n = $('#setNone'); if (n) n.classList.toggle('hidden', any); return;
  }
  if (t.dataset && t.dataset.custq !== undefined) { state.custQ = t.value; const l = $('#custList'); if (l) l.innerHTML = custRows(); return; }
  if (t.dataset && t.dataset.path && adminDraft) {
    const v = t.type === 'checkbox' ? t.checked : t.type === 'number' ? (t.value === '' ? 0 : Number(t.value)) : t.value;
    setPath(adminDraft, t.dataset.path, v);
    if (t.dataset.path.startsWith('design.colors.')) {
      applyTheme(adminDraft.design.colors);
      const code = t.parentElement && t.parentElement.querySelector('code'); if (code) code.textContent = t.value;
    }
    if (t.dataset.path === 'ads.mode') renderAdminTab(); else updateDirty();
  }
});

document.addEventListener('change', async e => {
  const t = e.target, d = t.dataset || {};
  if (t.name === 'area') { state.area = t.value; return updateSummary(); }
  if (t.name === 'pay') { state.pay = t.value; return; }
  if (t.id === 'c_terms') { state.terms = t.checked; return; }
  if (d.upload) return handleUpload(t);
  if (d.orderTrack) {
    const { error } = await sb.from('orders').update({ tracking: t.value.trim().slice(0, 200) }).eq('id', d.orderTrack);
    if (error) { toast('সংরক্ষণ ব্যর্থ — supabase-features.sql চালানো হয়েছে কি?', 'err'); return; }
    const o = state.adminOrders.find(x => x.id === d.orderTrack); if (o) o.tracking = t.value.trim();
    toast('✅ ট্র্যাকিং তথ্য সংরক্ষিত'); return;
  }
  if (d.orderStatus) {
    const { error } = await sb.from('orders').update({ status: t.value }).eq('id', d.orderStatus);
    if (error) { toast('স্ট্যাটাস আপডেট ব্যর্থ', 'err'); return; }
    const o = state.adminOrders.find(x => x.id === d.orderStatus); if (o) o.status = t.value;
    toast('✅ অর্ডার স্ট্যাটাস আপডেট হয়েছে'); renderAdminTab(); return;
  }
  if (d.lockmins !== undefined) { const L = lockGet(); L.mins = Number(t.value) || 5; lockSave(L); toast('✅ সংরক্ষিত'); return; }
  if (d.logf !== undefined) { state.logF = t.value; renderAdminTab(); return; }
  if (d.userRole) {
    const role = t.value;
    if (!confirm(LANG === 'en' ? `Change role to "${tr(ROLE_L[role])}"?` : `রোল পরিবর্তন করে "${ROLE_L[role]}" করবেন?`)) { await loadAdminUsers(); return renderAdminTab(); }
    const upd = { role }; if (role !== 'admin') upd.permissions = [];
    return updateUser(d.userRole, upd);
  }
  if (d.userPerm) {
    const row = t.closest('[data-urow]');
    const perms = $$('[data-user-perm]:checked', row).map(x => x.value);
    return updateUser(d.userPerm, { permissions: perms });
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (state.modal) closeModal(); else closeCart(); } });
window.addEventListener('hashchange', route);

/* ---------------------------- INIT ---------------------------- */
async function init() {
  document.documentElement.lang = LANG;
  translateAll();
  renderStore();
  if (sb) {
    await Promise.all([loadSettings(), loadProducts(), loadReviews()]);
    try {
      const { data } = await sb.auth.getSession();
      if (data && data.session) { state.user = data.session.user; await loadProfile(); loadMyOrders(); }
    } catch (e) { console.warn(e); }
    sb.auth.onAuthStateChange((ev, session) => {
      if (ev === 'INITIAL_SESSION' || ev === 'TOKEN_REFRESHED') return;
      setTimeout(async () => {
        state.user = session ? session.user : null;
        if (state.user) { await loadProfile(); loadMyOrders(); } else { state.profile = null; state.myOrders = []; }
        afterAuth();
      }, 0);
    });
  } else {
    state.products = DEMO_PRODUCTS;
    console.info('SAR\'S HOUSE: demo mode — set SUPABASE_URL and SUPABASE_ANON_KEY to go live.');
  }
  // drop cart lines for products that no longer exist
  state.cart = state.cart.filter(c => state.products.some(p => p.id === c.id)); saveCart();
  state.ready = true;
  renderStore(); subscribeMine(); route();
  hideSplash();
}
function hideSplash() { const sp = $('#splash'); if (!sp) return; sp.style.transition = 'opacity .25s'; sp.style.opacity = '0'; setTimeout(() => sp.remove(), 300); }
setTimeout(hideSplash, 8000);
init();
})();
</script>
</body>
